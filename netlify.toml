[build]
  publish = "dashboard/public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "META_API_VERSION"

[functions]
  node_bundler = "esbuild"

[functions.live]
  timeout = 26

[functions.pulse]
  timeout = 26

[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200

[[redirects]]
  from = "/api/pulse"
  to = "/.netlify/functions/pulse"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=90, stale-while-revalidate=60"
